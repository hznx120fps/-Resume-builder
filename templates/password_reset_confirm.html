{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                {% if validlink %}
                <h2>Новий пароль</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Зберегти пароль</button>
                </form>
                {% else %}
                <h2>Посилання недійсне</h2>
                <p>Посилання вже використано або термін його дії завершився.</p>
                <a class="btn btn-primary" href="{% url 'password_reset' %}">Запросити нове посилання</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
