{% extends 'base.html' %}
{% block content %}
<h2>{{ title }}</h2>
{% if selected_template %}
<p class="text-muted">Обраний шаблон: <strong>{{ selected_template }}</strong></p>
{% endif %}
<form method="post" class="mt-4">
    {% csrf_token %}
    <div class="row g-4">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="id_title" class="form-label">Заголовок</label>
                {{ form.title }}
            </div>
            <div class="mb-3">
                <label for="id_summary" class="form-label">Короткий опис</label>
                {{ form.summary }}
            </div>
            <div class="mb-3">
                <label for="id_experience" class="form-label">Досвід роботи</label>
                {{ form.experience }}
            </div>
            <div class="mb-3">
                <label for="id_education" class="form-label">Освіта</label>
                {{ form.education }}
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="id_skills" class="form-label">Навички</label>
                {{ form.skills }}
            </div>
            <div class="form-check mb-3">
                {{ form.is_public }}
                <label class="form-check-label" for="id_is_public">Публікувати резюме</label>
            </div>
            <button class="btn btn-primary" type="submit">Зберегти</button>
        </div>
    </div>
</form>
{% endblock %}
