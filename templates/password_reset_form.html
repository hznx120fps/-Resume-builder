{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Відновлення пароля</h2>
                <p class="text-muted">Введіть email, який вказували під час реєстрації.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.email.errors }}
                    <label class="form-label" for="id_email">Email</label>
                    {{ form.email }}
                    <button class="btn btn-primary mt-3" type="submit">Надіслати посилання</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
