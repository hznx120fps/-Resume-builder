{% extends 'base.html' %}
{% block content %}
<h2>Оголошення та новини</h2>
<p class="text-muted">Найсвіжіші новини від адміністратора.</p>
<div class="row g-3">
    {% for item in items %}
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title mb-0">{{ item.title }}</h5>
                    <small class="text-muted">{{ item.created_at|date:"d.m.Y H:i" }}</small>
                </div>
                <p class="card-text mb-0">{{ item.content }}</p>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-secondary">Новин поки немає.</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
